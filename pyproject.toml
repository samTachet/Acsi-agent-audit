[project]
name = "acsi-agent"
version = "0.1.0"
description = "Agent d'audit contraint (AuditPro/ACSI) : tools, gateway d'actions, approbation humaine, budget, rejeu"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.21",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acsi_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
