# eval : évaluation hermétique (aucun réseau, FS en lecture seule).
# api  : API HTTP (cp .env.example .env ; sans clé, toute requête est refusée).
services:
  eval:
    build: .
    image: acsi-agent:${IMAGE_TAG:-dev}
    command: ["python", "-m", "acsi_agent.eval"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    image: acsi-agent:${IMAGE_TAG:-dev}
    command: ["uvicorn", "acsi_agent.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - acsi-journal:/app/data/journal
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

volumes:
  acsi-journal: {}
